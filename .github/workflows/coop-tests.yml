# Co-op protocol unit tests (no game files needed): packet checks, ordering, loss, events and the router (UPnP)
# parsers. Savage Wind's own engine tests live in its repository (Revivedx/SavageWindRecomp).
name: Co-op tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coop-net:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-clang
      - run: clang -O1 -Iruntime tests/test_coop_net.c -lws2_32 -liphlpapi -o test_coop_net.exe
      - run: for m in "" guest sim events upnp; do ./test_coop_net.exe $m || exit 1; done
